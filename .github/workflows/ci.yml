name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run unit tests with coverage
        run: |
          xcodebuild test \
            -project SlowQuitApps.xcodeproj \
            -scheme SlowQuitApps \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      # Add CODECOV_TOKEN as a repository secret, or enable tokenless uploads
      # for this public repository in its Codecov settings.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit-tests
          plugins: xcode
          fail_ci_if_error: true
